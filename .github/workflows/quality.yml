name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.10.12
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Run coding and test gates
        run: bash scripts/check_quality.sh

      - name: Validate pull-request commit subjects
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check_commit_messages.py
          --range "${{ github.event.pull_request.base.sha }}..${{ github.sha }}"

      - name: Validate pushed commit subject
        if: github.event_name == 'push'
        run: >-
          python scripts/check_commit_messages.py
          --range "${{ github.event.before }}..${{ github.sha }}"
