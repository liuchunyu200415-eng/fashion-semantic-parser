app:
  name: fashion-semantic-parser
  env: development

paths:
  data_dir: data
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  knowledge_dir: data/knowledge
  model_dir: models/checkpoints
  output_dir: outputs

service:
  host: 0.0.0.0
  port: 8000

model:
  device: cuda
  precision: fp16

segmentation:
  config_path: configs/segmentation_mask2former_deployment.yaml
  query_auto_subject_roi: true

localization:
  backend: dense_mask2former_refinement
  config_path: configs/localization_mask2former_parts_targeted_deployment.yaml
  fallback_config_path: configs/localization_grounded_sam_hq.yaml
  dense_config_path: configs/localization_dense_local_reencoding.yaml

datasets:
  fashionai_root: data/raw/fashionai/round1_fashionAI_attributes_test_a
  deepfashion2_root: data/raw/deepfashion2
  fashionpedia_root: data/raw/fashionpedia
