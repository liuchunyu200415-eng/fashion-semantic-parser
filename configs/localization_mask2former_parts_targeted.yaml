# PRD 3.1.2 targeted replay for classes that remained flat or regressed after
# category-frequency fine-tuning. Every annotation on each selected image is
# retained to preserve garment context and reduce forgetting.
model_family: mask2former
train_json: data/processed/autodl/localization/fashionpedia_parts_train.json
additional_train_jsons:
  - data/processed/autodl/localization/fashionpedia_parts_train_critical_long_tail.json
train_source_repeat_factors:
  - 1.0
  - 2.0
val_json: data/processed/autodl/localization/fashionpedia_parts_validation.json
image_root: .
output_dir: outputs/localization/mask2former_parts_r50_targeted
config_source: local
config_file: external/Mask2Former/configs/coco/instance-segmentation/maskformer2_R50_bs16_50ep.yaml
weights: models/checkpoints/localization/mask2former_parts_r50_long_tail_5000.pth
num_classes: 19
category_names:
  - hood
  - collar
  - lapel
  - epaulette
  - sleeve
  - pocket
  - neckline
  - buckle
  - zipper
  - applique
  - bead
  - bow
  - flower
  - fringe
  - ribbon
  - rivet
  - ruffle
  - sequin
  - tassel
mask2former_eager_losses: true
ims_per_batch: 4
base_lr: 0.0000025
max_iter: 3000
checkpoint_period: 1000
eval_period: 0
num_workers: 2
score_threshold: 0.0
precision: fp16
device: cuda
resume: false
evaluate_after_training: false
