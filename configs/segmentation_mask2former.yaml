# PRD 3.1.1 target Mask2Former configuration.
#
# AutoDL setup expectation:
#   git clone https://github.com/facebookresearch/Mask2Former.git external/Mask2Former
#   export PYTHONPATH=$PWD/external/Mask2Former:$PYTHONPATH
#
# The config_file path below is relative to this project root after cloning.
model_family: mask2former
train_json: data/processed/autodl/segmentation/deepfashion2_train.json
val_json: data/processed/autodl/segmentation/deepfashion2_validation.json
image_root: .
output_dir: outputs/segmentation/mask2former_r50
config_source: local
config_file: external/Mask2Former/configs/coco/instance-segmentation/maskformer2_R50_bs16_50ep.yaml
weights: null
num_classes: 8
ims_per_batch: 2
base_lr: 0.0001
max_iter: 3000
num_workers: 2
score_threshold: 0.5
device: cuda

