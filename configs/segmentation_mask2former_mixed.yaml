# PRD 3.1.1 mixed-source consolidation after Fashionpedia transfer.
#
# DeepFashion2 has about 4.3 times as many images as mapped Fashionpedia. The
# repeat factors therefore produce an approximately 50:50 source mix without
# duplicating the large COCO files on disk.
model_family: mask2former
train_json: data/processed/autodl/segmentation/deepfashion2_train.json
additional_train_jsons:
  - data/processed/autodl/segmentation/fashionpedia_train.json
train_source_repeat_factors:
  - 1.0
  - 4.3
val_json: data/processed/autodl/segmentation/deepfashion2_validation_full.json
image_root: .
output_dir: outputs/segmentation/mixed/mask2former_r50_consolidation
config_source: local
config_file: external/Mask2Former/configs/coco/instance-segmentation/maskformer2_R50_bs16_50ep.yaml
weights: outputs/segmentation/fashionpedia/mask2former_r50_stage1_3090/model_0000999.pth
num_classes: 8
ims_per_batch: 4
base_lr: 0.000005
max_iter: 5000
checkpoint_period: 1000
eval_period: 0
num_workers: 2
score_threshold: 0.0
precision: fp16
device: cuda
resume: false
evaluate_after_training: false
