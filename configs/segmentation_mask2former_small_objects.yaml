# PRD 3.1.1 small-object deployment experiment.
#
# This profile preserves the accepted mixed checkpoint while increasing input
# detail and lowering thresholds only for the three small/rare categories.
# Formal COCO AP must still be evaluated separately at score threshold 0.0.
model_family: mask2former
train_json: data/processed/autodl/segmentation/deepfashion2_train.json
val_json: data/processed/autodl/segmentation/fashionpedia_validation.json
image_root: .
output_dir: outputs/segmentation/mixed/mask2former_r50_small_objects
config_source: local
config_file: external/Mask2Former/configs/coco/instance-segmentation/maskformer2_R50_bs16_50ep.yaml
weights: outputs/segmentation/mixed/mask2former_r50_consolidation/model_0001999.pth
num_classes: 8
num_workers: 2
score_threshold: 0.6
category_score_thresholds:
  shoes: 0.4
  bag: 0.3
  accessory: 0.3
min_size_test: 640
max_size_test: 1067
subject_roi_margin: 0.35
precision: fp16
device: cuda
