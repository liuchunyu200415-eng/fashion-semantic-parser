[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-semantic-parser"
version = "0.1.0"
description = "Multimodal fine-grained semantic parsing system for e-commerce fashion images."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.111.0",
    "numpy>=1.24.0,<2",
    "opencv-python>=4.8.0,<4.13",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.0",
    "flake8>=7.0.0",
    "isort>=5.13.0,<7",
    "mypy>=1.10.0",
    "pylint>=3.3.0,<4",
    "pytest>=8.2.0",
    "pytest-cov>=6.0.0,<7",
    "types-PyYAML>=6.0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.format]
max-line-length = 88

[tool.pylint.messages_control]
# Optional ML dependencies and extension-generated attributes are validated by
# explicit runtime readiness checks and cannot be imported in every CI job.
disable = ["import-error", "no-member"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["fashion_semantic_parser"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
